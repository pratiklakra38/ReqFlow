version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: reqflow-db
    restart: always
    environment:
      POSTGRES_DB: reqflow
      POSTGRES_USER: reqflow_user
      POSTGRES_PASSWORD: reqflow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
